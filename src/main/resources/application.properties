# ============================================================
# Memory Card Matching Game - Backend Configuration
# ============================================================

# --- Server ---
server.port=8080

# --- H2 File-Based Database (persists between restarts) ---
# The DB file will be saved in the project root under /data/
spring.datasource.url=jdbc:h2:file:./data/memorygame;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update = keeps your data between runs and adds new columns if you add fields
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Web Console (visit http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow the console to be reached from your browser (not just localhost)
spring.h2.console.settings.web-allow-others=true

# --- Logging (keep it readable during dev) ---
logging.level.com.memorygame=DEBUG
logging.level.org.hibernate.SQL=DEBUG

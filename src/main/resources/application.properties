# ============================================================
# Memory Card Matching Game - Backend Configuration
# ============================================================

# --- Server ---
server.port=8080

# --- H2 Embedded Database ---
# NOTE: was "jdbc:h2:mem:memorygame" (pure in-memory) which wiped all users,
# profiles, sessions, and scores every time the app restarted. Switched to a
# file-based store so data survives across runs (file lives in ./data/).
spring.datasource.url=jdbc:h2:file:./data/memorygame;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- H2 Web Console (visit http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Logging ---
logging.level.com.memorygame=DEBUG
logging.level.org.hibernate.SQL=DEBUG
